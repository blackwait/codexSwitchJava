name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish assets to GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag, for example v1.0.1"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag is required when publish_release is true."
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          POM_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          POM_VERSION="${POM_VERSION%-SNAPSHOT}"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Release tag version ($TAG_VERSION) must match pom.xml version ($POM_VERSION)."
            exit 1
          fi

      - name: Verify with Maven
        run: mvn -B clean package

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            javafx-platform: win
            package-type: exe
            artifact-ext: exe
            icon: src/main/resources/assets/icon_app.ico
          - name: linux-x64
            os: ubuntu-latest
            javafx-platform: linux
            package-type: app-image
            artifact-ext: tar.gz
            icon: src/main/resources/assets/icon_app.png
          - name: macos-x64
            os: macos-15-intel
            javafx-platform: mac
            package-type: dmg
            artifact-ext: dmg
            icon: src/main/resources/assets/icon_app.icns
          - name: macos-arm64
            os: macos-14
            javafx-platform: mac-aarch64
            package-type: dmg
            artifact-ext: dmg
            icon: src/main/resources/assets/icon_app.icns

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build runtime input
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests -Djavafx.platform="${{ matrix.javafx-platform }}"

          APP_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          APP_VERSION="${APP_VERSION%-SNAPSHOT}"
          APP_VERSION_PKG="$(echo "$APP_VERSION" | cut -d. -f1-3)"
          MAIN_JAR_PATH="$(find target/jpackage-input -maxdepth 1 -type f -name 'codex-switcher-javafx-*.jar' | head -n 1)"

          if [ -z "$MAIN_JAR_PATH" ]; then
            echo "No jpackage input jar found under target/jpackage-input/"
            find target -maxdepth 2 -print
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_PKG=$APP_VERSION_PKG" >> "$GITHUB_ENV"
          echo "MAIN_JAR=$(basename "$MAIN_JAR_PATH")" >> "$GITHUB_ENV"

      - name: Install WiX Toolset
        if: matrix.package-type == 'exe'
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wixBin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "bin" }
          if (-not $wixBin -or -not (Test-Path $wixBin)) {
            throw "WiX Toolset bin directory not found"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build app package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          JPACKAGE_CMD=(
            jpackage
            --type "${{ matrix.package-type }}"
            --name "CodexSwitcher"
            --app-version "$APP_VERSION_PKG"
            --input target/jpackage-input
            --main-jar "$MAIN_JAR"
            --main-class "com.codexswitcher.app.Launcher"
            --dest dist
          )

          if [ -n "${{ matrix.icon }}" ] && [ -f "${{ matrix.icon }}" ]; then
            JPACKAGE_CMD+=(--icon "${{ matrix.icon }}")
          fi

          if [ "${{ matrix.package-type }}" = "exe" ]; then
            JPACKAGE_CMD+=(
              --win-dir-chooser
              --win-shortcut
              --win-menu
              --win-menu-group "CodexSwitcher"
            )
          fi

          JPACKAGE_CMD+=(
            --java-options "-Dfile.encoding=UTF-8"
            --java-options "--enable-native-access=ALL-UNNAMED"
            --vendor "CodexSwitcher"
          )

          "${JPACKAGE_CMD[@]}"

      - name: Prepare installer artifact
        if: matrix.package-type != 'app-image'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="CodexSwitcher-${{ matrix.name }}-${APP_VERSION}.${{ matrix.artifact-ext }}"
          PACKAGE_PATH="$(find dist -maxdepth 1 -type f -name "*.${{ matrix.artifact-ext }}" | head -n 1)"
          if [ -z "$PACKAGE_PATH" ]; then
            echo "No installer package found under dist/"
            find dist -maxdepth 2 -print
            exit 1
          fi
          cp "$PACKAGE_PATH" "$ARTIFACT"
          echo "ARCHIVE_PATH=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Archive Linux app image
        if: matrix.package-type == 'app-image'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="CodexSwitcher-${{ matrix.name }}-${APP_VERSION}.tar.gz"
          if [ ! -d "dist/CodexSwitcher" ]; then
            echo "No Linux app image found under dist/"
            find dist -maxdepth 2 -print
            exit 1
          fi
          tar -C dist -czf "$ARCHIVE" "CodexSwitcher"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ env.ARCHIVE_PATH }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: actions/upload-artifact@v4
        with:
          name: CodexSwitcher-${{ matrix.name }}-${{ env.APP_VERSION }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 3
          if-no-files-found: error
